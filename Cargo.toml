[workspace]
resolver = "3"
members = ["crates/fleetdeck-core", "crates/fleetdeck"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jayjongcheolpark/fleetdeck"

[workspace.dependencies]
fleetdeck-core = { path = "crates/fleetdeck-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
base64 = "0.22"
anyhow = "1"
ratatui = "0.30"
tempfile = "3"
unicode-width = "0.2"
